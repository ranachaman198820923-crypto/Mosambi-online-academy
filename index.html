<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصعب بن عمیر رضی اللہ عنہ آن لائن اکیڈمی</title>
    <!-- یہاں آپ کا وہی پرانا سٹائل موجود ہے -->
    <style>
        :root { --primary: #00e676; --secondary: #121826; --accent: #ffd700; --text-dark: #e0e6ed; --card-bg: rgba(26, 34, 56, 0.9); --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a); }
        body { font-family: 'Jameel Noori Nastaleeq', sans-serif; background: var(--bg-gradient); color: var(--text-dark); margin: 0; padding-top: 80px; min-height: 100vh; }
        .top-bar { position: fixed; top: 0; width: 100%; background: #000; z-index: 1000; display: flex; justify-content: center; gap: 10px; padding: 10px; border-bottom: 2px solid var(--primary); }
        .chip { background: #1a2238; color: var(--primary); border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #mainWebsite { max-width: 850px; margin: auto; padding: 15px; }
        .section-card { background: var(--card-bg); border: 2px solid rgba(0,230,118,0.3); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .action-tile { background: rgba(255,255,255,0.04); border: 2px solid var(--primary); color: var(--primary); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; margin: 10px 0; }
        .secret-panel { display: none; background: #1e1b4b; border: 3px dashed var(--accent); padding: 20px; border-radius: 15px; margin-top: 20px; }
        .input-box { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--primary); background: #000; color: #fff; }
        .main-btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ٹاپ بار (خفیہ بٹنوں کے ساتھ) -->
    <div class="top-bar">
        <button class="chip" onclick="openViewerTracker()">👁️</button> <!-- خفیہ آنکھ کا نشان -->
        <button class="chip" onclick="navigator.clipboard.writeText(window.location.href); alert('لنک کاپی ہو گیا!');">🔗</button>
        <button class="chip" ondblclick="openSecretAIPanel()">⚙️</button> <!-- اے آئی پینل -->
    </div>

    <div id="mainWebsite">
        <h1>مصعب بن عمیر رضی اللہ عنہ آن لائن اکیڈمی</h1>

        <!-- خفیہ اے آئی پینل (جو صرف پاسورڈ سے کھلے گا) -->
        <div id="secretAIPanel" class="secret-panel">
            <h3>🤖 اے آئی کنٹرولر (اپنی سوچ لکھیں)</h3>
            <textarea id="aiCommandInput" class="input-box" placeholder="جو تبدیلی کرنی ہے لکھیں..."></textarea>
            <button class="main-btn" onclick="runSmartAIUpdate()">تبدیل کریں ⚡</button>
        </div>

        <!-- پرانی کیٹگریز اور بٹنز -->
        <div class="section-card">
            <h3>💳 فیس اکاؤنٹ</h3>
            <p>ایزی پیسہ: 03074974713 (رانا افتخار احمد)</p>
        </div>

        <div class="section-card">
            <h3>📚 ہمارے کورسز</h3>
            <div class="action-tile" onclick="alert('حفظ کورس میں خوش آمدید')">📖 حفظ کورس</div>
            <div class="action-tile" onclick="alert('ناظرہ کورس میں خوش آمدید')">📗 ناظرہ کورس</div>
        </div>
        
        <div class="section-card">
            <h3>🎧 آڈیو قرآن مجید</h3>
            <audio controls style="width:100%;">
                <source src="https://server11.mp3quran.net/sds/001.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        // وزٹر ٹریکنگ (نام محفوظ کرنا)
        let name = localStorage.getItem('academy_user') || "نامعلوم";
        let logs = JSON.parse(localStorage.getItem('website_logs') || '[]');
        logs.push({ name: name, time: new Date().toLocaleTimeString() });
        localStorage.setItem('website_logs', JSON.stringify(logs));

        // خفیہ آنکھ فنکشن
        function openViewerTracker() {
            if(prompt("پاسورڈ درج کریں:") === "chaman786") {
                let logs = JSON.parse(localStorage.getItem('website_logs') || '[]');
                alert("ویب سائٹ وزٹرز:\n" + logs.map(l => l.name + " (" + l.time + ")").join('\n'));
            } else { alert("غلط پاسورڈ!"); }
        }

        // اے آئی پینل فنکشن
        function openSecretAIPanel() {
            if(prompt("پاسورڈ درج کریں:") === "chaman786") {
                document.getElementById('secretAIPanel').style.display = 'block';
            }
        }

        // اے آئی سے ویب سائٹ تبدیل کرنا
        function runSmartAIUpdate() {
            let cmd = document.getElementById('aiCommandInput').value;
            let div = document.createElement('div');
            div.className = 'section-card';
            div.innerHTML = `<h3>نیو اپڈیٹ</h3><p>${cmd}</p>`;
            document.getElementById('mainWebsite').appendChild(div);
            alert("ویب سائٹ اپڈیٹ ہو گئی!");
        }
    </script>
</body>
</html>
