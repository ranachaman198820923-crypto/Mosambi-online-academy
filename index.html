<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصعب بن عمیر اکیڈمی - ڈیش بورڈ</title>
    <style>
        :root { --primary: #00e676; --accent: #ffd700; }
        body { background: #0f172a; color: #fff; font-family: 'Jameel Noori Nastaleeq', sans-serif; padding: 20px; }

        /* متحرک لائٹنگ بارڈر */
        .glowing-box {
            position: relative;
            background: #1a2238;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .glowing-box::before {
            content: '';
            position: absolute;
            top: -3px; bottom: -3px; left: -3px; right: -3px;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--primary));
            border-radius: 17px;
            z-index: -1;
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        .fee-input { width: 100%; padding: 10px; margin-top: 10px; background: #000; color: #fff; border: 1px solid var(--primary); }
        .search-dashboard { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

    <!-- فیس ادائیگی اور اسکرین شاٹ سیکشن -->
    <div class="glowing-box">
        <h2 style="color:var(--primary)">💳 فیس ادائیگی اور تصدیق</h2>
        <p>اپنی فیس درج ذیل نمبر پر بھیجیں اور اسکرین شاٹ نیچے اپ لوڈ کریں:</p>
        <div style="background:#000; padding:15px; border-radius:10px;">
            <p><strong>ایزی پیسہ / جاز کیش:</strong> 03074974713 (رانا چمن)</p>
        </div>
        <br>
        <label>📸 ادائیگی کا اسکرین شاٹ اپ لوڈ کریں:</label>
        <input type="file" class="fee-input" accept="image/*">
        <button style="background:var(--primary); width:100%; padding:10px; margin-top:10px; border:none; border-radius:5px;">تصدیق کے لیے بھیجیں</button>
    </div>

    <!-- لائبریری ڈیش بورڈ -->
    <div class="glowing-box search-dashboard">
        <h2 style="color:var(--accent)">📚 لائبریری سرچ ڈیش بورڈ</h2>
        <p>آپ کون سی کتاب یا سورت پڑھنا چاہتے ہیں؟</p>
        <input type="text" id="libSearch" class="fee-input" placeholder="کتاب کا نام لکھیں (مثلاً: سورۃ البقرہ، قاعدہ)">
        <button onclick="searchAction()" style="background:var(--accent); padding:10px 30px; margin-top:10px; border:none; border-radius:5px; font-weight:bold;">تلاش شروع کریں</button>
    </div>

    <script>
        function searchAction() {
            let val = document.getElementById('libSearch').value;
            if(val) { alert("تلاش کیا جا رہا ہے: " + val); }
        }
    </script>
</body>
</html>
