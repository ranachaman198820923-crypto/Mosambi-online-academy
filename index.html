<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصعب بن عمیر آن لائن اکیڈمی</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; text-align: center; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b512e; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 85%; max-width: 350px; }
        .login-box h2 { color: #0b512e; margin-bottom: 20px; font-size: 22px; }
        .login-box input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        .login-box button { width: 95%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #error-msg { color: red; margin-top: 10px; display: none; }
        #main-content { display: none; }
        header { background-color: #0b512e; color: #ffd700; padding: 30px 15px; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-whatsapp { display: inline-block; background-color: #25D366; color: white; padding: 12px 25px; text-decoration: none; font-size: 18px; border-radius: 25px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>مصعب بن عمیر آن لائن اکیڈمی</h2>
            <p>ویب سائٹ کھولنے کے لیے پاسورڈ درج کریں:</p>
            <input type="password" id="password-input" placeholder="پاسورڈ لکھیں">
            <button onclick="checkPassword()">لاگ ان کریں</button>
            <p id="error-msg">غلط پاسورڈ! دوبارہ کوشش کریں۔</p>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1>مصعب بن عمیر آن لائن اکیڈمی</h1>
            <p>گھر بیٹھے معیاری، تجوید کے ساتھ اور مستند دینی تعلیم حاصل کریں</p>
        </header>
        <div class="container">
            <div class="card">
                <h3>3 دن کی مفت ٹرائل کلاس حاصل کریں!</h3>
                <a href="https://wa.me/923074974713" class="btn-whatsapp" target="_blank">واٹس ایپ پر رابطہ کریں (03074974713)</a>
            </div>
            <div class="card">
                <h3>تلاوتِ قرآن پاک سنیں</h3>
                <audio controls style="width: 100%;"><source src="https://www.everymuslim.net/mp3/Quraan/Abdulbasit%20Abdussamad/Mujawwad/001.mp3" type="audio/mpeg"></audio>
            </div>
        </div>
    </div>
    <script>
        function checkPassword() {
            if (document.getElementById("password-input").value === "1234") {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else { document.getElementById("error-msg").style.display = "block"; }
        }
    </script>
</body>
</html>
