<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصعب بن عمیر آن لائن اکیڈمی</title>
    <style>
        :root { --primary: #046307; --secondary: #f4f9f4; --accent: #ffa726; --card-bg: #ffffff; }
        body { font-family: 'Jameel Noori Nastaleeq', sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; }
        .main-card { max-width: 600px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); text-align: center; }
        .highlight { background: #fff3e0; border-right: 5px solid var(--accent); padding: 15px; border-radius: 10px; margin: 20px 0; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .upload-section { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="main-card">
    <h1>مصعب بن عمیر آن لائن اکیڈمی</h1>
    
    <div class="highlight">
        <h3>💳 ادائیگی کی تفصیلات</h3>
        <p><strong>نام:</strong> رانا افتخار احمد</p>
        <p><strong>ایزی پیسہ نمبر:</strong> 03074974713</p>
    </div>

    <div class="upload-section">
        <h2>🧾 فیس رسید اپلوڈ کریں</h2>
        <input type="text" id="stdName" placeholder="اپنا نام لکھیں">
        <input type="file" id="fileUpload" accept="image/*">
        <button onclick="saveData()">محفوظ کریں</button>
    </div>

    <div id="profile" style="margin-top:20px; display:none;">
        <h2>👤 طالب علم پروفائل</h2>
        <p id="displayName"></p>
        <p>✅ رسید موصول ہوئی!</p>
    </div>
</div>

<script>
    function saveData() {
        const name = document.getElementById('stdName').value;
        const file = document.getElementById('fileUpload').files[0];
        if(name && file) {
            localStorage.setItem('studentName', name);
            document.getElementById('displayName').innerText = "نام: " + name;
            document.getElementById('profile').style.display = 'block';
            alert("شکریہ! آپ کی رسید موصول ہو گئی ہے۔");
        } else {
            alert("براہ کرم اپنا نام لکھیں اور تصویر منتخب کریں۔");
        }
    }
</script>

</body>
</html>
