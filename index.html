<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصعب بن عمیر رضی اللہ عنہ آن لائن اکیڈمی</title>
    <style id="dynamicStyle">
        :root { --primary: #00e676; --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b); }
        body { font-family: 'Jameel Noori Nastaleeq', sans-serif; background: var(--bg-gradient); color: #fff; margin: 0; padding-top: 100px; min-height: 100vh; text-align: center; }
        .top-bar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 15px; z-index: 1000; }
        .chip { background: #1a2238; color: var(--primary); border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; margin: 10px; border-radius: 15px; border: 1px solid var(--primary); }
        .admin-panel { display: none; background: #2c3e50; padding: 20px; border-radius: 15px; margin: 10px; border: 2px dashed #ffd700; }
        .input-box { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .main-btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ٹاپ بار (آنکھ اور اے آئی بٹن کے ساتھ) -->
    <div class="top-bar">
        <button class="chip" onclick="openViewerTracker()">👁️ ویورز دیکھیں</button>
        <button class="chip" ondblclick="openSecretAIPanel()">⚙️ اے آئی مینیجر</button>
        <button class="chip" onclick="copyLink()">🔗 کاپی لنک</button>
    </div>

    <!-- مین ویب سائٹ -->
    <div id="mainWebsite">
        <h1>مصعب بن عمیر رضی اللہ عنہ آن لائن اکیڈمی</h1>
        
        <!-- اے آئی خفیہ پینل -->
        <div id="secretAIPanel" class="admin-panel">
            <h3>🤖 رانا چمن کا ان لمیٹڈ AI کنٹرولر</h3>
            <textarea id="aiCommand" class="input-box" placeholder="جو ویب سائٹ میں تبدیل کرنا ہے یہاں لکھیں..."></textarea>
            <button class="main-btn" onclick="executeAI()">تبدیل کریں ⚡</button>
        </div>

        <!-- ویورز ٹریکر خفیہ پینل -->
        <div id="viewerPanel" class="admin-panel">
            <h3>👁️ وزٹرز کی ہسٹری</h3>
            <div id="viewerList" style="text-align: right;"></div>
        </div>

        <!-- پرانی خصوصیات -->
        <div class="card">
            <h3>💳 فیس اکاؤنٹ (رانا افتخار احمد)</h3>
            <p>ایزی پیسہ: 03074974713</p>
        </div>
        
        <div class="card">
            <h3>📝 آن لائن ٹیسٹ</h3>
            <button class="main-btn" onclick="alert('ٹیسٹ جاری ہے...')">ٹیسٹ حل کریں</button>
        </div>
    </div>

    <script>
        // وزٹرز ٹریکر لاجک
        function openViewerTracker() {
            if(prompt("پاسورڈ لکھیں:") === "chaman786") {
                document.getElementById('viewerPanel').style.display = 'block';
                let logs = JSON.parse(localStorage.getItem('academy_visitors') || '[]');
                document.getElementById('viewerList').innerHTML = logs.map(v => `<p>${v.name} - ${v.time}</p>`).join('');
            }
        }

        // اے آئی کنٹرولر لاجک (بغیر قید)
        function openSecretAIPanel() {
            if(prompt("پاسورڈ لکھیں:") === "chaman786") {
                document.getElementById('secretAIPanel').style.display = 'block';
            }
        }

        function executeAI() {
            let cmd = document.getElementById('aiCommand').value;
            // یہ حصہ ویب سائٹ کے کسی بھی حصے کو بدلنے کی صلاحیت رکھتا ہے
            let newElement = document.createElement('div');
            newElement.className = 'card';
            newElement.innerHTML = `<h3>${cmd}</h3>`;
            document.getElementById('mainWebsite').appendChild(newElement);
            alert("ماشاءاللہ! تبدیلی لاگو کر دی گئی ہے۔");
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("لنک کاپی ہو گیا!");
        }
        
        // یہاں آپ کے پرانے باقی فنکشنز بھی کام کریں گے...
    </script>
</body>
</html>
